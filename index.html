<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
<style>
:root {
  --color-fg: #16181d; --color-fg-muted: #5f6672; --color-bg: #f7f8fa; --color-panel: #ffffff; --color-border-line: #e3e6eb;
  --color-ok: #1a7f4b; --color-warn: #a86200; --color-bad: #c2362b;
  --font-anthropic-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --font-anthropic-serif: Georgia, serif;
  --cds-font-size-caption: 0.8125rem; --cds-font-size-body: 0.9375rem; --cds-font-size-heading: 1.125rem; --cds-font-size-title: 1.75rem; --cds-font-weight-medium: 500;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 20px; --cds-gap-xl: 32px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 16px; --cds-pad-xl: 24px; --cds-radius: 8px;
  --cds-chart-grid: #e6e9ee; --cds-chart-axis: #b8bec8; --cds-text-secondary: #5f6672;
  --cds-surface-popover: #ffffff; --cds-border: #e3e6eb; --cds-shadow-popover: 0 4px 16px rgba(0,0,0,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-fg: #eceef2; --color-fg-muted: #a2a9b5; --color-bg: #121418; --color-panel: #1b1e24; --color-border-line: #2c3038;
    --color-ok: #4cc38a; --color-warn: #e0a040; --color-bad: #f0776b;
    --cds-chart-grid: #2c3038; --cds-chart-axis: #4a505b; --cds-text-secondary: #a2a9b5;
    --cds-surface-popover: #1b1e24; --cds-border: #2c3038; --cds-shadow-popover: 0 4px 16px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); line-height: 1.5; }
#dash-root { max-width: 1200px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
img { max-width: 100%; }
[hidden] { display: none !important; }
.dash-skeleton:empty::before { content: "\2014"; color: var(--color-fg-muted); }
</style>
<style>
.pd { display: flex; flex-direction: column; gap: var(--cds-gap-xl); font-family: var(--font-anthropic-sans); color: var(--color-fg); }

.pd-note { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }

.pd-sec { display: flex; flex-direction: column; gap: var(--cds-gap-md); min-width: 0; }

@media (max-width: 520px) { .pd-brow { grid-template-columns: 1fr 2.5rem; } .pd-brow-l { grid-column: 1 / -1; } }
.pd-tablewrap { overflow-x: auto; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-panel); }

.pd-foot dd { margin: 0; color: var(--color-fg-muted); }
.pd { --to-sky: #3D8BEA; --to-sky-deep: #1C58B8; --to-sky-soft: color-mix(in srgb, #3D8BEA 10%, var(--color-panel)); --to-yellow: #FFFF61; --to-ink: #111111; }
.pd-hero { display: flex; flex-direction: column; gap: var(--cds-gap-md); }
.pd-logo { width: 88px; height: auto; display: block; }
.pd-hero h1 { color: var(--color-fg); font-family: var(--font-anthropic-sans); font-weight: 700; letter-spacing: -0.01em; font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1.15; }

.pd-big { font-family: var(--font-anthropic-sans); font-weight: 700; color: var(--to-sky-deep); }
@media (prefers-color-scheme: dark) { .pd-big { color: #8EC5FB; } }
:root[data-theme="dark"] .pd-big { color: #8EC5FB; }
:root[data-theme="light"] .pd-big { color: var(--to-sky-deep); }
.pd-chip { background: var(--to-sky-soft); border-color: color-mix(in srgb, var(--to-sky) 30%, var(--color-border-line)); }
.pd-brand-h > span:first-child { display: inline-flex; align-items: center; gap: 10px; }
.pd-offer-cell { display: inline-flex; align-items: center; gap: 10px; font-weight: var(--cds-font-weight-medium); }
.pd-offer-cell img { width: 24px; height: 24px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--color-border-line); }
.pd-brand-logo { width: 32px; height: 32px; border-radius: 50%; display: block; flex: none; box-shadow: 0 0 0 1px var(--color-border-line); }
.pd-btn-primary { background: var(--to-yellow); color: var(--to-ink); border-color: #d9d94f; font-weight: var(--cds-font-weight-medium); }

.pd-config { background: var(--to-sky-soft); }
.pd-config { border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-panel); padding: var(--cds-pad-sm) var(--cds-pad-md); font-size: var(--cds-font-size-caption); }
.pd-config > summary { cursor: pointer; font-weight: var(--cds-font-weight-medium); padding: 4px 0; }
.pd-config-body { display: flex; flex-direction: column; gap: var(--cds-gap-md); padding: var(--cds-pad-sm) 0 var(--cds-pad-xs); }
.pd-config-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--cds-gap-md); }
.pd-config fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pd-config legend { color: var(--color-fg-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0 0 4px; }
.pd-config label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.pd-config input { margin: 0; }
.pd-config-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-sm); color: var(--color-fg-muted); }
.pd-btn { font: inherit; color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 4px 12px; cursor: pointer; }
.pd-btn:hover { border-color: var(--color-fg-muted); }
.pd-btn:focus-visible, .pd-config input:focus-visible, .pd-config summary:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
.pd-prio-set { grid-column: span 2; }
@media (max-width: 520px) { .pd-prio-set { grid-column: auto; } }
.pd-prow { display: flex; align-items: center; justify-content: space-between; gap: var(--cds-gap-sm); }
.pd-prio { width: 3.5rem; font: inherit; color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 2px 6px; text-align: center; font-variant-numeric: tabular-nums; }
.pd-prio:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 1px; }
.pd-cb-gap { display: inline-block; width: 13px; }
.pd-config { order: -1; }
.pd-grid { min-width: 980px; }
.pd-grid td.pd-route { min-width: 190px; }
.pd-grid th:first-child { min-width: 190px; }
.pd-grid thead th { vertical-align: bottom; }
.pd-grid .pd-bh { text-align: center; border-left: 1px solid var(--color-border-line); padding-bottom: 4px; }
.pd-grid .pd-bh span { display: inline-flex; align-items: center; gap: 6px; color: var(--color-fg); }
.pd-grid .pd-bh img { width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 1px var(--color-border-line); }
.pd-grid .pd-oh { text-align: center; white-space: normal; min-width: 86px; max-width: 110px; font-weight: 400; line-height: 1.3; }
.pd-grid .pd-oh.pd-first, .pd-grid td.pd-first { border-left: 1px solid var(--color-border-line); }
.pd-grid td.pd-tick { text-align: center; vertical-align: middle; }
.pd-tickmark { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--to-sky); color: #fff; font-size: 13px; font-weight: 700; line-height: 1; }
.pd-tickcount { display: block; font-size: 0.72rem; color: var(--color-fg-muted); margin-top: 2px; }
.pd-tickempty { color: var(--color-border-line); }
.pd-hide-c2 tr > :nth-child(2), .pd-hide-c3 tr > :nth-child(3), .pd-hide-c4 tr > :nth-child(4), .pd-hide-c5 tr > :nth-child(5) { display: none; }
@media print { .pd-config { display: none; } }

.pd-prio-set { grid-column: span 2; }
.pd-hovertile { position: relative; cursor: default; outline: none; }
.pd-hint { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted, #6b7280); }
.pd-planpop { display: none; position: absolute; z-index: 5; top: 100%; left: 0; margin-top: 6px; min-width: 240px; padding: 10px 12px; background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.pd-hovertile:hover .pd-planpop, .pd-hovertile:focus-within .pd-planpop, .pd-hovertile:focus .pd-planpop { display: block; }
.pd-planpop-h { font-weight: 600; margin-bottom: 6px; }
.pd-planrow { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-top: 1px solid var(--color-border-line); }

.pd-planrow small { color: var(--color-fg-muted, #6b7280); font-size: var(--cds-font-size-caption); }
</style>

<script src="config.js"></script>

<body>
<div id="dash-root"></div>
<script>
(function () {
  const C = window.DASHBOARD;
  if (!C) { document.body.textContent = 'config.js did not load. Check that it sits next to index.html and has no typing errors.'; return; }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const img = (src, cls) => { const i = document.createElement('img'); i.src = src; i.alt = ''; if (cls) i.className = cls; return i; };
  const num = (v) => Number(v || 0).toLocaleString('en-IN');
  const money = (v) => (C.currency || '') + num(v);
  const pct = (v) => (Math.round(v * 10) / 10).toFixed(1) + '%';
  const col = C.columns || {};

  function parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    text = String(text || '').trim();
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    const head = (rows.shift() || []).map((h) => h.trim());
    return rows.filter((r) => r.some((v) => v.trim() !== '')).map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
  }

  /* ---- Data ---- */
  const rules = (C.offers || []).map((o) => ({ re: new RegExp(o.match, 'i'), brand: o.brand, name: o.name }));
  const destTypes = new Set(C.countAtDestination || ['Arrival']);
  const rows = parseCSV(C.redemptionsCsv).map((r) => {
    const code = r[col.offer] || '';
    const hit = rules.find((x) => x.re.test(code));
    const rawType = r[col.travelType] || '';
    const atTo = destTypes.has(rawType);
    const fromName = r[col.fromAirport] || '', toName = r[col.toAirport] || '';
    const from = (C.airports || {})[fromName] || fromName, to = (C.airports || {})[toName] || toName;
    return {
      user: r[col.user], brand: hit ? hit.brand : code.replace(/^SubOffer|Takeoff$/g, ''), offer: hit ? hit.name : 'Other',
      rawType, type: (C.travelTypes || {})[rawType] || rawType,
      kind: rawType === 'Departure' ? 'departure' : atTo ? 'arrival' : 'other',
      route: from + ' → ' + to,
      airport: atTo ? to : from, airportName: atTo ? toName : fromName, terminal: atTo ? r[col.toTerminal] : r[col.fromTerminal]
    };
  });
  const computed = { offers_redeemed: rows.length, users_redeemed: new Set(rows.map((r) => r.user)).size, routes: new Set(rows.map((r) => r.route)).size };
  const value = (key) => (C.numbers && C.numbers[key] != null) ? C.numbers[key] : computed[key];
  const plans = Array.isArray(C.plans) && C.plans.length ? C.plans : null;
  let currentPlan = '';
  function planVals() {
    if (!plans) return null;
    const out = { passes: 0, revenue: 0, ch: {} };
    plans.filter((p) => !currentPlan || p.name === currentPlan).forEach((p) => {
      Object.entries(p.passes || {}).forEach(([ch, n]) => {
        n = +n || 0; const rev = n * (+p.price || 0);
        out.passes += n; out.revenue += rev;
        out.ch[ch] = out.ch[ch] || { passes: 0, revenue: 0 }; out.ch[ch].passes += n; out.ch[ch].revenue += rev;
      });
    });
    return out;
  }
  const planTiles = []; let redrawChannels = () => {};
  function tileValue(t) {
    const pv = planVals();
    if (pv && t.value === 'total_purchase') return pv.passes;
    if (pv && t.value === 'total_revenue') return pv.revenue;
    return value(t.value);
  }

  const brandOrder = [];
  const brandTotals = new Map(), offerTotals = new Map();
  rows.forEach((r) => {
    brandTotals.set(r.brand, (brandTotals.get(r.brand) || 0) + 1);
    const k = r.brand + '|' + r.offer;
    if (!offerTotals.has(k)) offerTotals.set(k, { brand: r.brand, offer: r.offer, total: 0, departure: 0, arrival: 0, other: 0 });
    const o = offerTotals.get(k); o.total += 1; o[r.kind] += 1;
  });
  [...brandTotals].sort((a, b) => b[1] - a[1]).forEach(([b]) => brandOrder.push(b));
  const offersOf = (b) => [...offerTotals.values()].filter((o) => o.brand === b).sort((x, y) => y.total - x.total);
  const brandInfo = (b) => (C.brands || {})[b] || {};
  const colors = Object.assign({ primary: '#3D8BEA', tileNumber: '#1C58B8', departure: '#3D8BEA', arrival: '#1C58B8', otherOffers: '#E0C200' }, C.colors || {});
  const kindColor = { departure: colors.departure, arrival: colors.arrival, other: colors.otherOffers };
  const typeName = (kind) => kind === 'departure' ? ((C.travelTypes || {}).Departure || 'Departure') : kind === 'arrival' ? ((C.travelTypes || {}).Arrival || 'Arrival') : ((C.travelTypes || {}).Common || 'Other Offers');

  /* ---- Page ---- */
  document.title = (C.page && C.page.browserTab) || 'Dashboard';
  const root = document.getElementById('dash-root');
  const pd = el('div', 'pd');
  pd.style.setProperty('--to-sky', colors.primary);
  pd.style.setProperty('--to-sky-deep', colors.tileNumber);
  root.append(pd);
  const sectionCfg = (C.sections || []);
  const secById = Object.fromEntries(sectionCfg.map((s) => [s.id, s]));

  const header = el('header', 'pd-head pd-hero');
  if (C.page && C.page.logo) header.append(img(C.page.logo, 'pd-logo'));
  const h1 = el('h1', null, ((C.page && C.page.title) || '') + ' ');
  if (C.page && C.page.titleAccent) h1.append(el('em', null, C.page.titleAccent));
  header.append(h1);
  header.style.order = '-1';

  function sectionShell(id) {
    const s = secById[id] || {};
    const sec = el('section', 'pd-sec'); sec.id = id;
    if (s.title) sec.append(el('h2', null, s.title));
    if (s.subtitle) sec.append(el('p', 'pd-sec-sub', s.subtitle));
    return sec;
  }
  const builders = {
    headline() {
      const wrap = el('div', 'pd-tiles'); wrap.id = 'headline';
      (C.tiles || []).forEach((t, i) => {
        const tile = el('div', 'pd-tile'); tile.dataset.tile = String(i);
        tile.append(el('span', 'pd-label', t.label));
        const hover = t.planHover && plans;
        if (hover) {
          tile.classList.add('pd-hovertile'); tile.tabIndex = 0;
          tile.append(el('span', 'pd-hint', 'Tap to see plans'));
          const pop = el('div', 'pd-planpop'); pop.append(el('div', 'pd-planpop-h', 'By plan'));
          plans.forEach((p) => {
            const ch = Object.entries(p.passes || {}); const n = ch.reduce((a, [, v]) => a + (+v || 0), 0);
            const row = el('div', 'pd-planrow');
            const left = el('span', null, p.name + ' \u00b7 ' + money(p.price));
            if (ch.length > 1) left.append(el('small', null, ch.map(([c, v]) => num(+v) + ' ' + c).join(', ')));
            row.append(left, el('b', null, num(n))); pop.append(row);
          });
          tile.append(pop);
        }
        const big = el('span', 'pd-big');
        const paint = () => { const v = tileValue(t); big.textContent = v == null ? '\u2014' : (t.format === 'money' ? money(v) : num(v)); };
        paint(); planTiles.push(paint);
        big.style.color = colors.tileNumber;
        tile.append(big); wrap.append(tile);
      });
      return wrap;
    },
    channels() {
      const sec = sectionShell('channels');
      const showRev = (secById.channels || {}).showRevenue !== false;
      const t = el('table', 'pd-kv');
      t.innerHTML = '<thead><tr><th>Channel</th><th>Passes</th>' + (showRev ? '<th>Revenue</th>' : '') + '</tr></thead>';
      const tb = el('tbody');
      redrawChannels = () => {
        tb.replaceChildren(); let p = 0, r = 0; const plv = planVals();
        const line = (label, pv, rv, color) => {
          const tr = el('tr'); const td = el('td');
          if (color) { const sp = el('span'); const sw = el('i', 'pd-sw'); sw.style.background = color; sp.append(sw, document.createTextNode(label)); td.append(sp); } else td.textContent = label;
          tr.append(td, el('td', null, num(pv))); if (showRev) tr.append(el('td', null, money(rv))); tb.append(tr);
        };
        (C.channels || []).forEach((c) => {
          const pv = plv ? ((plv.ch[c.name] || {}).passes || 0) : (+value(c.passes) || 0);
          const rv = plv ? ((plv.ch[c.name] || {}).revenue || 0) : (+value(c.revenue) || 0);
          p += pv; r += rv; line(c.name, pv, rv, c.color || colors.primary);
        });
        line('Total', p, r, null);
      };
      redrawChannels();
      t.append(tb); sec.append(t); return sec;
    },
    travel() {
      const sec = sectionShell('travel'); const showShare = (secById.travel || {}).showShare !== false;
      const t = el('table', 'pd-kv');
      t.innerHTML = '<thead><tr><th>Travel type</th><th>Redemptions</th>' + (showShare ? '<th>Share</th>' : '') + '</tr></thead>';
      const tb = el('tbody'); const m = new Map();
      rows.forEach((r) => m.set(r.type, (m.get(r.type) || 0) + 1));
      [...m].sort((a, b) => b[1] - a[1]).forEach(([k, n]) => {
        const tr = el('tr'); tr.append(el('td', null, k), el('td', null, num(n)));
        if (showShare) tr.append(el('td', null, pct(n / (rows.length || 1) * 100)));
        tb.append(tr);
      });
      t.append(tb); sec.append(t); return sec;
    },
    airports() {
      const sec = sectionShell('airports');
      const wrap = el('div', 'pd-tablewrap'); const t = el('table', 'pd-table pd-grid');
      const thead = el('thead'); const r1 = el('tr'), r2 = el('tr');
      [['Airport', ''], [typeName('departure'), 'pd-num'], [typeName('arrival'), 'pd-num'], [typeName('other'), 'pd-num'], ['Total', 'pd-num'], ['Terminals', '']].forEach(([l, c]) => { const th = el('th', c || null, l); th.rowSpan = 2; r1.append(th); });
      brandOrder.forEach((b) => {
        const offs = offersOf(b); const th = el('th', 'pd-bh'); th.colSpan = offs.length;
        const sp = el('span'); if (brandInfo(b).logo) sp.append(img(brandInfo(b).logo)); sp.append(document.createTextNode(b)); th.append(sp); r1.append(th);
        offs.forEach((o, i) => r2.append(el('th', 'pd-oh' + (i === 0 ? ' pd-first' : ''), o.offer)));
      });
      thead.append(r1, r2); t.append(thead);
      const g = new Map();
      rows.forEach((r) => {
        if (!g.has(r.airport)) g.set(r.airport, { code: r.airport, name: r.airportName, departure: 0, arrival: 0, other: 0, total: 0, terms: new Set(), by: new Map() });
        const a = g.get(r.airport); a[r.kind] += 1; a.total += 1; if (r.terminal) a.terms.add(r.terminal);
        const k = r.brand + '|' + r.offer; a.by.set(k, (a.by.get(k) || 0) + 1);
      });
      const tb = el('tbody');
      [...g.values()].sort((a, b) => b.total - a.total || a.code.localeCompare(b.code)).forEach((a) => {
        const tr = el('tr'); const td = el('td', 'pd-route', a.code); if (a.name !== a.code) td.append(el('span', 'pd-route-sub', a.name)); tr.append(td);
        ['departure', 'arrival', 'other', 'total'].forEach((k) => tr.append(el('td', 'pd-num' + (a[k] ? '' : ' pd-muted'), num(a[k]))));
        tr.append(el('td', null, [...a.terms].sort().join(', ')));
        brandOrder.forEach((b) => offersOf(b).forEach((o, i) => {
          const c = a.by.get(b + '|' + o.offer) || 0; const cell = el('td', 'pd-tick' + (i === 0 ? ' pd-first' : ''));
          if (c) { const m = el('span', 'pd-tickmark', '✓'); m.style.background = brandInfo(b).color || colors.primary; m.setAttribute('aria-label', b + ' ' + o.offer + ': ' + c); cell.append(m, el('span', 'pd-tickcount', '×' + c)); }
          else cell.append(el('span', 'pd-tickempty', '–'));
          tr.append(cell);
        }));
        tb.append(tr);
      });
      t.append(tb); wrap.append(t); sec.append(wrap); return sec;
    },
    offers() {
      const sec = sectionShell('offers');
      const lg = el('div', 'pd-legend');
      ['departure', 'arrival', 'other'].forEach((k) => { const sp = el('span'); const sw = el('i', 'pd-sw'); sw.style.background = kindColor[k]; sp.append(sw, document.createTextNode(typeName(k))); lg.append(sp); });
      sec.append(lg);
      const list = el('div', 'pd-offers');
      const max = Math.max(1, ...[...offerTotals.values()].map((o) => o.total));
      brandOrder.forEach((b) => {
        const box = el('div', 'pd-brand'); const h = el('div', 'pd-brand-h');
        const nm = el('span'); if (brandInfo(b).logo) nm.append(img(brandInfo(b).logo, 'pd-brand-logo')); nm.append(document.createTextNode(b));
        const tot = el('span'); tot.append(el('span', null, num(brandTotals.get(b))), el('small', null, ' redemptions'));
        h.append(nm, tot); box.append(h);
        offersOf(b).forEach((o) => {
          const row = el('div', 'pd-brow'); const track = el('div', 'pd-track');
          const parts = ['departure', 'arrival', 'other'].filter((k) => o[k] > 0);
          parts.forEach((k) => { const f = el('div', 'pd-fill'); f.style.width = (o[k] / max * 100) + '%'; f.style.background = kindColor[k]; f.title = typeName(k) + ': ' + o[k]; track.append(f); });
          row.append(el('span', 'pd-brow-l', o.offer), track, el('span', 'pd-brow-v', num(o.total)));
          const info = el('div', 'pd-bwhere');
          parts.forEach((k) => { const sp = el('span'); const sw = el('i', 'pd-sw'); sw.style.background = kindColor[k]; sp.append(sw, document.createTextNode(typeName(k) + ' '), el('b', null, num(o[k]))); info.append(sp); });
          row.append(info); box.append(row);
        });
        list.append(box);
      });
      sec.append(list); return sec;
    },
    definitions() {
      const d = el('details', 'pd-foot'); d.id = 'definitions';
      d.append(el('summary', null, (secById.definitions || {}).title || 'Definitions'));
      const dl = el('dl'); (C.definitions || []).forEach(([t, x]) => dl.append(el('dt', null, t), el('dd', null, x))); d.append(dl);
      return d;
    }
  };

  const blocks = {};
  sectionCfg.forEach((s) => { if (builders[s.id]) { blocks[s.id] = builders[s.id](); pd.append(blocks[s.id]); } });
  pd.prepend(header);

  /* ---- Viewer controls: show/hide and priority, saved in this browser ---- */
  const tiles = [...pd.querySelectorAll('[data-tile]')];
  const key = 'dash-view-' + JSON.stringify([sectionCfg, C.tiles]).length + '-' + sectionCfg.map((s) => s.id + (s.show !== false)).join('');
  let state = null;
  try { state = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { state = null; }
  const defaults = () => ({
    sections: Object.fromEntries(sectionCfg.map((s, i) => [s.id, { show: s.show !== false, prio: i + 1 }])),
    tiles: (C.tiles || []).map((t) => t.show !== false)
  });
  state = state || defaults();
  function apply() {
    sectionCfg.forEach((s) => { const b = blocks[s.id]; const st = state.sections[s.id]; if (!b || !st) return; b.hidden = !st.show; b.style.order = String(st.prio); });
    tiles.forEach((t, i) => { t.hidden = state.tiles[i] === false; });
    try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }
  if (!C.page || C.page.showControls !== false) {
    const det = el('details', 'pd-config'); det.style.order = '-2';
    det.append(el('summary', null, 'Show or hide fields'));
    const body = el('div', 'pd-config-body'); const groups = el('div', 'pd-config-groups');
    const fs1 = el('fieldset'); fs1.append(el('legend', null, 'Headline'));
    (C.tiles || []).forEach((t, i) => {
      const lab = el('label'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = state.tiles[i] !== false;
      cb.addEventListener('change', () => { state.tiles[i] = cb.checked; apply(); });
      lab.append(cb, document.createTextNode(' ' + t.label)); fs1.append(lab);
    });
    const fs2 = el('fieldset', 'pd-prio-set'); fs2.append(el('legend', null, 'Sections and priority (1 shows first)'));
    const prioInputs = [];
    sectionCfg.forEach((s) => {
      if (!blocks[s.id]) return;
      const row = el('div', 'pd-prow'); const lab = el('label'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = state.sections[s.id].show;
      cb.addEventListener('change', () => { state.sections[s.id].show = cb.checked; apply(); });
      lab.append(cb, document.createTextNode(' ' + (s.label || s.title || s.id)));
      const pi = el('input', 'pd-prio'); pi.type = 'number'; pi.min = '1'; pi.max = '99'; pi.value = state.sections[s.id].prio; pi.setAttribute('aria-label', 'Priority for ' + (s.label || s.title));
      pi.addEventListener('change', () => { const v = parseInt(pi.value, 10); if (v > 0) { state.sections[s.id].prio = v; apply(); } });
      prioInputs.push([s.id, pi, cb]);
      row.append(lab, pi); fs2.append(row);
    });
    groups.append(fs1, fs2);
    const actions = el('div', 'pd-config-actions');
    const reset = el('button', 'pd-btn pd-btn-primary', 'Reset to defaults'); reset.type = 'button';
    reset.addEventListener('click', () => {
      state = defaults();
      fs1.querySelectorAll('input').forEach((cb, i) => { cb.checked = state.tiles[i]; });
      prioInputs.forEach(([id, pi, cb]) => { pi.value = state.sections[id].prio; cb.checked = state.sections[id].show; });
      apply();
    });
    actions.append(reset, el('span', null, 'Your choices are remembered in this browser.'));
    body.append(groups, actions); det.append(body); pd.prepend(det);
  }
  apply();
})();
</script>
</body>
</html>
